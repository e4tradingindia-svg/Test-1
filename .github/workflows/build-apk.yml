name: Build and Commit Debug APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'downloads/**'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-commit:
    name: Build & Commit Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure .env.example exists for Secrets Gradle Plugin
        run: |
          if [ ! -f .env ] && [ ! -f .env.example ]; then
            touch .env.example
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Copy and Commit Debug APK to Repository
        run: |
          mkdir -p downloads
          cp -f app/build/outputs/apk/debug/app-debug.apk downloads/SalonMate-debug.apk

          # Configure Git Identity
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Check if downloads/SalonMate-debug.apk has changed
          git add downloads/SalonMate-debug.apk
          if git diff --staged --quiet; then
            echo "No changes in APK binary. Skipping commit."
          else
            echo "New APK generated. Committing and pushing to main..."
            git commit -m "Auto-build: update SalonMate-debug.apk [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
